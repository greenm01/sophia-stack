CONSTANTS
    Generations = {1, 2}
    Digests = {"digest-a", "digest-b"}
    Transactions = {1, 2, 3}
    Epochs = {1, 2, 3}
    InitialGeneration = 1
    InitialDigest = "digest-a"
    InitialEpoch = 1
    NoGeneration = 0
    NoDigest = "none"
    NoTransaction = 0
    NoEpoch = 0
    InitialLayoutToken = 1
    ReplacementLimit = 2
    MismatchLimit = 1
    DisconnectLimit = 2
    TimeoutLimit = 1
    DelayedAckLimit = 1
    PrematureConfigurationLimit = 1
    ConfigurationLimit = 1

INIT MCInit
NEXT MCNext
VIEW MCView

INVARIANTS
    MCTypeOK
    OutstandingCorrelationIsCurrent
    PreparedStateRequiresCurrentCompletion
    \* Scenario invariants are enabled in focused hunt configurations.
    \* ReattachmentRequiresExactActiveIdentity
    \* ReattachmentUsesFreshEpoch
    \* ConfigurationRequiresReattachedActive
    \* ReattachmentCannotChangeGlobalProfile
    \* StaleReattachmentAckIsInert
    \* ReattachmentFailurePreservesSession
    \* LoadedCandidateBoundsAcknowledgement
