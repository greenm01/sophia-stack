CONSTANTS
    Generations = {1}
    Digests = {"digest-a", "digest-b"}
    Transactions = {1, 2}
    Epochs = {1, 2}
    InitialGeneration = 1
    InitialDigest = "digest-a"
    InitialEpoch = 1
    NoGeneration = 0
    NoDigest = "none"
    NoTransaction = 0
    NoEpoch = 0
    InitialLayoutToken = 1

INIT Init
NEXT Next

INVARIANTS
    TypeOK
    ReattachmentRequiresExactActiveIdentity
    ReattachmentUsesFreshEpoch
    ConfigurationRequiresReattachedActive
    ReattachmentCannotChangeGlobalProfile
    StaleReattachmentAckIsInert
    ReattachmentFailurePreservesSession
    LoadedCandidateBoundsAcknowledgement
    OutstandingCorrelationIsCurrent
    PreparedStateRequiresCurrentCompletion
