CONSTANTS
    LocalAuthorities = {"shell", "input"}
    Generations = {1}
    Digests = {"digest-a", "digest-b"}
    Transactions = {1}
    Epochs = {1, 2}
    ConfigGenerations = {1}
    NoGeneration = 0
    NoDigest = "none"
    NoTransaction = 0
    NoEpoch = 0
    StageLimit = 1
    MismatchLimit = 1
    RejectLimit = 1
    DisconnectLimit = 1
    TimeoutLimit = 1

INIT MCInit
NEXT MCNext
VIEW MCView

INVARIANTS
    MCTypeOK
    RejectedNeverPromoted
    PreparedRequiresExactExternalAck
    \* Scenario invariants are enabled in focused hunt configurations.
    \* GraphicsRequireGlobalActivation
    \* HagiaAckMatchesLoadedCandidate
    \* CompletionMatchesConnection
    \* ConfigurationFollowsProfileActivation
    \* FailureCannotPromote
    \* NoPartialVisibility
    \* IdentityNamespacesAreDistinct
    \* PostPromotionRestartExcluded
