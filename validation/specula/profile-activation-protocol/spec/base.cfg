CONSTANTS
    LocalAuthorities = {"shell", "shortcut", "session", "input", "output", "broker"}
    Generations = {1, 2}
    Digests = {"digest-a", "digest-b"}
    Transactions = {1, 2}
    Epochs = {1, 2}
    ConfigGenerations = {1, 2}
    NoGeneration = 0
    NoDigest = "none"
    NoTransaction = 0
    NoEpoch = 0

INIT Init
NEXT Next

INVARIANTS
    TypeOK
    GraphicsRequireGlobalActivation
    HagiaAckMatchesLoadedCandidate
    CompletionMatchesConnection
    ConfigurationFollowsProfileActivation
    FailureCannotPromote
    NoPartialVisibility
    IdentityNamespacesAreDistinct
    RejectedNeverPromoted
    PreparedRequiresExactExternalAck
