\* The running code judges a retirement by the frame the scheduler names now,
\* so a frame superseded while still in the kernel is judged unowned and the
\* session ends. A passing run here would mean the model no longer detects the
\* failure it exists to exclude, so success is an error.
CONSTANTS
    MaxFrames = 3
    SchedulerOnlyOwnership = TRUE
    LeaveCohortPending = FALSE

SPECIFICATION FairSpec

INVARIANTS
    TypeOK
    SettledWereSubmitted
    NoSubmittedFrameIsStranded

PROPERTIES
    EveryKernelFrameSettles
    PendingPresentSettles
