\* Settle a superseded frame but leave its cohort pending, which is what the
\* code did between the first fix and this one. The cohort then never stops
\* waiting, and in the running system the next scene submission finds it and
\* dies. A passing run here would mean the model no longer detects that.
CONSTANTS
    MaxFrames = 3
    SchedulerOnlyOwnership = FALSE
    LeaveCohortPending = TRUE

SPECIFICATION FairSpec

INVARIANTS
    TypeOK
    SettledWereSubmitted
    NoSubmittedFrameIsStranded

PROPERTIES
    PendingPresentSettles
