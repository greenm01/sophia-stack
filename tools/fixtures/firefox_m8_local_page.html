<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>0000000000000000</title>
<style>
  html, body { min-height: 100%; margin: 0; background: #102038; color: #fff; font: 28px sans-serif; }
  main { box-sizing: border-box; min-height: 100vh; padding: 8vh 10vw; }
  input, button { box-sizing: border-box; display: block; width: 100%; margin: 3vh 0; padding: 2vh; font: inherit; }
  #status { min-height: 2em; padding: 2vh; background: #284a78; }
  #next { min-height: 3em; padding: 2vh; background: #183252; }
  #navigate { display: none; box-sizing: border-box; padding: 35vh 10vw; background: #183252; color: #fff; text-align: center; }
  #scroll-proof { display: none; height: 160vh; padding: 10vh; background: linear-gradient(#183252, #624070); }
  .primary-proof #primary { position: fixed; inset: 0; z-index: 10; margin: 0; }
  .navigation-proof #navigate { display: block; position: fixed; inset: 0; z-index: 10; }
  .scroll-proof #scroll-proof { display: block; }
  .dialog-proof #dialog { position: fixed; inset: 0; z-index: 10; margin: 0; }
</style>
<main>
  <h1>Sophia Firefox offline proof</h1>
  <input id="source" autofocus aria-label="source" placeholder="type sophia">
  <input id="clipboard" aria-label="clipboard target" placeholder="clipboard target">
  <input id="primary" aria-label="primary target" placeholder="primary target">
  <button id="dialog">Open proof dialog</button>
  <div id="status">waiting</div>
  <div id="next">Step 1/8: type <strong>sophia</strong>.</div>
</main>
<a id="navigate" href="?navigated=1">Navigate to the scroll proof page</a>
<div id="scroll-proof">Continue scrolling down this real document.</div>
<script>
  const stages = [16, 32, 48, 64, 80, 96, 112, 128];
  const navigated = new URLSearchParams(location.search).get('navigated') === '1';
  let stage = navigated ? 3 : 0;
  let refocusArmed = false;
  let verticalWheelEvents = 0;
  const status = document.querySelector('#status');
  const next = document.querySelector('#next');
  const source = document.querySelector('#source');
  let typed = '';
  const nextSteps = [
    'Step 1/8: type sophia.',
    'Step 2/8: Ctrl+A, Ctrl+C, Tab, Ctrl+V.',
    'Step 3/8: move the pointer well inside this colored page, away from every screen edge, then middle-click.',
    'Step 4/8: click the full-page navigation target, then scroll vertically through at least two notches on the next document.',
    'Step 5/8: press Super+Space to resize.',
    'Step 6/8: press Super+J away, then Super+J as needed until Firefox returns.',
    'Step 7/8: click the full-page dialog target, then press Enter.',
    'Step 8/8 complete: press Ctrl+Q for a normal Firefox close.'
  ];
  function advance(label) {
    stage += 1;
    document.body.classList.toggle('primary-proof', stage === 2);
    document.body.classList.toggle('navigation-proof', stage === 3 && !navigated);
    document.body.classList.toggle('dialog-proof', stage === 6);
    document.title = '0'.repeat(stages[stage]);
    status.textContent = label;
    next.textContent = nextSteps[stage];
    document.body.style.background = `hsl(${stage * 47} 55% 24%)`;
    if (stage === 1 || stage === 2) {
      source.focus();
      source.select();
    }
  }
  addEventListener('focus', () => {
    if (stage === 1 || stage === 2) {
      source.focus();
      source.select();
    } else if (stage === 5 && refocusArmed) {
      advance('refocus complete');
    }
  });
  addEventListener('blur', () => {
    if (stage === 5) refocusArmed = true;
  });
  source.addEventListener('input', event => {
    if (stage === 0 && event.target.value === 'sophia') advance('keyboard complete');
  });
  addEventListener('keydown', event => {
    if (stage === 5 && event.key === 'r') {
      advance('refocus complete');
      return;
    }
    if (stage !== 0 || event.ctrlKey || event.altKey || event.metaKey || event.key.length !== 1) return;
    typed = (typed + event.key).slice(-6);
    if (typed === 'sophia') {
      source.value = 'sophia';
      advance('keyboard complete');
    }
  });
  addEventListener('paste', event => {
    if (stage === 1) {
      event.preventDefault();
      document.querySelector('#clipboard').value = 'sophia';
      advance('clipboard complete');
    } else if (stage === 2) {
      event.preventDefault();
      document.querySelector('#primary').value = 'sophia';
      advance('primary complete');
    }
  });
  document.querySelector('#clipboard').addEventListener('input', event => {
    if (stage === 1 && event.target.value === 'sophia') {
      advance('clipboard complete');
    }
  });
  document.querySelector('#primary').addEventListener('input', event => {
    if (stage === 2 && event.target.value === 'sophia') advance('primary complete');
  });
  function completeScrollIfReady() {
    if (stage === 3 && navigated && verticalWheelEvents >= 2 && scrollY > 0) {
      advance('navigation and document scroll complete');
    }
  }
  addEventListener('wheel', event => {
    if (stage !== 3 || !navigated) return;
    if (event.deltaY === 0) {
      status.textContent = 'XI2 scroll baseline received';
      next.textContent = 'Step 4/8: scroll vertically once more; keep the pointer inside the page.';
      return;
    }
    verticalWheelEvents += 1;
    completeScrollIfReady();
  }, { passive: true });
  addEventListener('scroll', completeScrollIfReady, { passive: true });
  addEventListener('resize', () => {
    if (stage === 4) advance('resize complete');
  });
  document.querySelector('#dialog').addEventListener('click', () => {
    if (stage === 6) {
      alert('Sophia dialog proof');
      advance('dialog complete');
    }
  });
  if (navigated) {
    document.title = '0'.repeat(stages[stage]);
    document.body.classList.add('scroll-proof');
    status.textContent = 'navigation complete';
    next.textContent = nextSteps[stage];
  }
</script>
</html>
