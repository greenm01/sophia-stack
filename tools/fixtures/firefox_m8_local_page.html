<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>0000000000000000</title>
<style>
  html, body { min-height: 100%; margin: 0; background: #102038; color: #fff; font: 28px sans-serif; }
  main { box-sizing: border-box; min-height: 100vh; padding: 8vh 10vw; }
  input, button { box-sizing: border-box; display: block; width: 100%; margin: 3vh 0; padding: 2vh; font: inherit; }
  #status { min-height: 2em; padding: 2vh; background: #284a78; }
  #next { min-height: 3em; padding: 2vh; background: #183252; }
  #navigate { display: none; box-sizing: border-box; padding: 35vh 10vw; background: #183252; color: #fff; text-align: center; }
  #scroll-proof { display: none; height: 160vh; padding: 10vh; background: linear-gradient(#183252, #624070); }
  .primary-proof #primary { position: fixed; inset: 0; z-index: 10; margin: 0; }
  .navigation-proof #navigate { display: block; position: fixed; inset: 0; z-index: 10; }
  .scroll-proof #scroll-proof { display: block; }
  .dialog-proof #dialog { position: fixed; inset: 0; z-index: 10; margin: 0; }
  #proof-dialog { width: min(80vw, 720px); padding: 0; border: 4px solid #70b7ff; background: #183252; }
  #proof-dialog::backdrop { background: rgb(0 0 0 / 65%); }
  #proof-dialog button { min-height: 30vh; margin: 0; }
</style>
<main>
  <h1>Sophia Firefox offline proof</h1>
  <input id="source" autofocus aria-label="source" placeholder="type sophia">
  <input id="clipboard" aria-label="clipboard target" placeholder="clipboard target">
  <input id="primary" aria-label="primary target" placeholder="primary target">
  <button id="dialog">Open proof dialog</button>
  <dialog id="proof-dialog"><button id="confirm" autofocus>Confirm Sophia dialog</button></dialog>
  <div id="status">waiting</div>
  <div id="next">Step 1/8: type <strong>sophia</strong>.</div>
</main>
<a id="navigate" href="?navigated=1">Navigate to the scroll proof page</a>
<div id="scroll-proof">Continue scrolling down this real document.</div>
<script>
  const stages = [16, 32, 48, 64, 80, 96, 112, 128];
  const parameters = new URLSearchParams(location.search);
  const navigated = parameters.get('navigated') === '1';
  const selectionPeer = parameters.get('selection_peer') === 'kitty';
  const renderingOnly = parameters.get('rendering_only') === '1';
  const dialogOnly = parameters.get('dialog_only') === '1';
  const lifecycleOnly = parameters.get('lifecycle_only') === '1';
  let stage = dialogOnly ? 6 : navigated ? 3 : 0;
  let refocusArmed = false;
  let selectionPeerAway = false;
  let primarySourceArmed = false;
  let verticalWheelEvents = 0;
  const status = document.querySelector('#status');
  const next = document.querySelector('#next');
  const source = document.querySelector('#source');
  let typed = '';
  const nextSteps = [
    'Step 1/8: type sophia.',
    selectionPeer
      ? 'Step 2/8: Ctrl+A and Ctrl+C. Cycle with Super+J to the selection Kitty, follow its CLIPBOARD prompt, copy its returned token, cycle back here, then press Ctrl+V.'
      : 'Step 2/8: Ctrl+A, Ctrl+C, Tab, Ctrl+V.',
    selectionPeer
      ? 'Step 3/8: physically drag-select the entire Firefox PRIMARY token. Wait for PRIMARY armed, cycle to the selection Kitty, follow its prompt, select its returned token, cycle back here, then middle-click.'
      : 'Step 3/8: move the pointer well inside this colored page, away from every screen edge, then middle-click.',
    'Step 4/8: click the full-page navigation target, then scroll vertically through at least two notches on the next document.',
    'Step 5/8: press Super+Space to resize.',
    'Step 6/8: press Super+J away, then Super+J as needed until Firefox returns.',
    'Step 7/8: click the full-page dialog target, then click the modal confirmation.',
    'Step 8/8 complete: press Ctrl+Q for a normal Firefox close.'
  ];
  function advance(label) {
    stage += 1;
    document.body.classList.toggle('primary-proof', stage === 2 && !selectionPeer);
    document.body.classList.toggle('navigation-proof', stage === 3 && !navigated);
    document.body.classList.toggle('dialog-proof', stage === 6);
    document.title = '0'.repeat(stages[stage]);
    status.textContent = label;
    next.textContent = nextSteps[stage];
    document.body.style.background = `hsl(${stage * 47} 55% 24%)`;
    if (selectionPeer && stage === 2) {
      source.value = 'sophia-firefox-primary';
      source.focus();
    } else if (stage === 1 || stage === 2) {
      source.focus();
      source.select();
    }
  }
  addEventListener('focus', () => {
    if (selectionPeer && selectionPeerAway && stage === 1) {
      selectionPeerAway = false;
      document.querySelector('#clipboard').focus();
    } else if (selectionPeer && selectionPeerAway && stage === 2) {
      selectionPeerAway = false;
      document.body.classList.add('primary-proof');
      document.querySelector('#primary').focus();
    } else if (stage === 1 || stage === 2) {
      source.focus();
      source.select();
    } else if (stage === 5 && refocusArmed) {
      advance('refocus complete');
    }
  });
  addEventListener('blur', () => {
    if (selectionPeer && stage === 1) selectionPeerAway = true;
    if (selectionPeer && stage === 2) {
      selectionPeerAway = primarySourceArmed;
      if (!primarySourceArmed) {
        status.textContent = 'PRIMARY is not armed';
        next.textContent = 'Return here and physically drag-select the entire Firefox PRIMARY token before switching windows.';
      }
    }
    if (stage === 5) refocusArmed = true;
  });
  source.addEventListener('input', event => {
    if (stage === 0 && event.target.value === 'sophia') advance('keyboard complete');
  });
  source.addEventListener('select', event => {
    if (!selectionPeer || stage !== 2 || !event.isTrusted) return;
    if (source.selectionStart !== 0 || source.selectionEnd !== source.value.length) return;
    primarySourceArmed = true;
    status.textContent = 'PRIMARY armed';
    next.textContent = 'Cycle to the selection Kitty and follow its PRIMARY prompt.';
  });
  addEventListener('keydown', event => {
    if (stage !== 0 || event.ctrlKey || event.altKey || event.metaKey || event.key.length !== 1) return;
    typed = (typed + event.key).slice(-6);
    if (typed === 'sophia') {
      source.value = 'sophia';
      advance('keyboard complete');
    }
  });
  addEventListener('paste', event => {
    if (selectionPeer) return;
    if (stage === 1) {
      event.preventDefault();
      document.querySelector('#clipboard').value = 'sophia';
      advance('clipboard complete');
    } else if (stage === 2) {
      event.preventDefault();
      document.querySelector('#primary').value = 'sophia';
      advance('primary complete');
    }
  });
  document.querySelector('#clipboard').addEventListener('input', event => {
    const expected = selectionPeer ? 'sophia-kitty-clipboard' : 'sophia';
    if (stage === 1 && event.target.value === expected) {
      advance('clipboard complete');
    }
  });
  document.querySelector('#primary').addEventListener('input', event => {
    const expected = selectionPeer ? 'sophia-kitty-primary' : 'sophia';
    if (stage === 2 && event.target.value === expected) advance('primary complete');
  });
  function completeScrollIfReady() {
    // XI2's first absolute-axis value establishes GTK's baseline and does not
    // become a DOM wheel event. The harness separately proves both routed
    // notches; this page proves the resulting DOM event and displacement.
    if (stage === 3 && navigated && verticalWheelEvents >= 1 && scrollY > 0) {
      advance('navigation and document scroll complete');
    }
  }
  addEventListener('wheel', event => {
    if (stage !== 3 || !navigated) return;
    verticalWheelEvents += 1;
    if (event.deltaY === 0) {
      status.textContent = 'XI2 scroll baseline received';
      next.textContent = 'Step 4/8: scroll vertically once more; keep the pointer inside the page.';
      completeScrollIfReady();
      return;
    }
    completeScrollIfReady();
  }, { passive: true });
  addEventListener('scroll', completeScrollIfReady, { passive: true });
  addEventListener('resize', () => {
    if (stage === 4) advance('resize complete');
  });
  document.querySelector('#dialog').addEventListener('click', event => {
    if (stage === 6 && (!dialogOnly || event.isTrusted)) {
      const dialog = document.querySelector('#proof-dialog');
      dialog.showModal();
      document.querySelector('#confirm').focus();
      // The out-of-band title proves that the DOM modal is painted and ready
      // without creating another X11 toplevel.
      document.title = '0'.repeat(dialogOnly ? 226 : stages[6] + 1);
    }
  });
  document.querySelector('#confirm').addEventListener('click', event => {
    if (stage === 6 && (!dialogOnly || event.isTrusted)) {
      document.querySelector('#proof-dialog').close();
      document.title = '0'.repeat(dialogOnly ? 227 : stages[7]);
      if (dialogOnly) {
        document.body.classList.remove('dialog-proof');
        status.textContent = 'Firefox dialog canary complete';
        next.textContent = 'Press Super+Shift+Q to finish.';
      }
    }
  });
  if (dialogOnly) {
    // Firefox appends its 20-byte product suffix to file-document titles.
    document.title = '0'.repeat(225);
    source.hidden = true;
    document.querySelector('#clipboard').hidden = true;
    document.querySelector('#primary').hidden = true;
    document.body.classList.add('dialog-proof');
    status.textContent = 'Firefox dialog canary ready';
    next.textContent = 'Click Open proof dialog, then click Confirm Sophia dialog.';
  } else if (renderingOnly) {
    // Firefox appends its 20-byte product suffix to file-document titles.
    document.title = '0'.repeat(229);
    source.hidden = true;
    document.querySelector('#clipboard').hidden = true;
    document.querySelector('#primary').hidden = true;
    document.querySelector('#dialog').hidden = true;
    status.textContent = 'Firefox rendering canary ready';
    next.textContent = 'The browser must fill the left column from top to bottom with no black region. Press Super+Shift+Q to finish.';
  } else if (navigated) {
    // Use an out-of-band title length so the session can prove that the
    // replacement document is ready without accidentally completing scroll.
    document.title = '0'.repeat(stages[stage] + 1);
    document.body.classList.add('scroll-proof');
    status.textContent = 'navigation complete';
    next.textContent = nextSteps[stage];
  } else if (selectionPeer) {
    document.querySelector('#navigate').href = '?navigated=1&selection_peer=kitty';
  } else if (lifecycleOnly) {
    status.textContent = 'Firefox lifecycle page ready';
    next.textContent = 'Press Ctrl+Q now, then return to the Kitty checkpoints.';
  }
</script>
</html>
